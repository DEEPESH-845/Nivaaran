<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Specimen identity record for Sunita Devi, photographed at an angle with glare">
  <!--
    The awkward one, on purpose: rotated, grainy, and lit by a window. It is
    here so `quality` and `confidence` demonstrably do something rather than
    always coming back "clear / high" on studio-perfect inputs.
  -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft"><feFuncA type="linear" slope="0.085"/></feComponentTransfer>
      <feComposite in="soft" in2="SourceGraphic" operator="over"/>
    </filter>
    <linearGradient id="glare" x1="0.18" y1="0" x2="0.62" y2="1">
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="620" fill="#cfccc4"/>

  <g filter="url(#grain)">
    <g transform="rotate(-5.5 500 310)">
      <rect x="70" y="66" width="880" height="500" rx="16" fill="#f7f5ef" stroke="#d8d5cd" stroke-width="2"/>

      <rect x="70" y="66" width="880" height="70" rx="16" fill="#eeece5"/>
      <rect x="70" y="120" width="880" height="16" fill="#eeece5"/>
      <text x="104" y="112" font-family="Georgia, serif" font-size="25" letter-spacing="1.5" fill="#20232d">Identity record</text>
      <text x="916" y="112" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.6" fill="#5d6270">SPECIMEN</text>

      <rect x="104" y="176" width="150" height="182" rx="8" fill="#e6e3db" stroke="#d8d5cd" stroke-width="2"/>
      <circle cx="179" cy="242" r="34" fill="#d2cfc6"/>
      <path d="M125 348c0-34 24-60 54-60s54 26 54 60z" fill="#d2cfc6"/>

      <text x="298" y="194" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.2" fill="#5d6270">NAME</text>
      <text x="298" y="232" font-family="ui-sans-serif, system-ui, sans-serif" font-size="36" fill="#20232d">Sunita Devi</text>

      <text x="298" y="296" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.2" fill="#5d6270">DATE OF BIRTH</text>
      <text x="298" y="334" font-family="ui-monospace, Menlo, monospace" font-size="32" fill="#20232d">07 / 02 / 1985</text>

      <text x="298" y="394" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" letter-spacing="2.2" fill="#5d6270">ISSUED AT</text>
      <text x="298" y="424" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#20232d">Jaipur, Rajasthan</text>

      <line x1="104" y1="462" x2="916" y2="462" stroke="#ddd9d1" stroke-width="2"/>
      <text x="104" y="498" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#b4532b">SPECIMEN · SYNTHETIC · NOT A GOVERNMENT DOCUMENT</text>
      <text x="104" y="528" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" fill="#5d6270">Photographed at an angle, on purpose. Carries no number of any kind.</text>

      <g opacity="0.09" transform="rotate(-22 510 310)">
        <text x="510" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="70" font-weight="700" letter-spacing="6" fill="#20232d">SPECIMEN</text>
      </g>
    </g>
  </g>

  <rect width="1000" height="620" fill="url(#glare)"/>
</svg>
