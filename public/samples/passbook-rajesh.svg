<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Specimen bank passbook page for Rajesh Kumar Sharma">
  <!-- Synthetic specimen. The account number is masked in print: only the last
       four digits are legible, which is all the engine ever compares. -->
  <rect width="1000" height="620" fill="#e8e6df"/>
  <rect x="40" y="40" width="920" height="540" rx="10" fill="#fcfbf8" stroke="#e3e3e8" stroke-width="2"/>
  <line x1="500" y1="40" x2="500" y2="580" stroke="#eceae4" stroke-width="3"/>

  <text x="76" y="106" font-family="Georgia, serif" font-size="27" letter-spacing="1.2" fill="#22252f">Savings account passbook</text>
  <text x="924" y="106" text-anchor="end" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.6" fill="#6b7180">SPECIMEN</text>
  <line x1="76" y1="128" x2="924" y2="128" stroke="#22252f" stroke-width="2"/>

  <text x="76" y="182" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.2" fill="#6b7180">ACCOUNT HOLDER</text>
  <text x="76" y="220" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" fill="#22252f">Rajesh Kumar Sharma</text>

  <text x="76" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.2" fill="#6b7180">ACCOUNT NUMBER</text>
  <text x="76" y="326" font-family="ui-monospace, Menlo, monospace" font-size="32" fill="#22252f">XXXX XXXX 8842</text>

  <text x="540" y="286" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.2" fill="#6b7180">IFSC</text>
  <text x="540" y="326" font-family="ui-monospace, Menlo, monospace" font-size="32" fill="#22252f">CORP0001234</text>

  <text x="76" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.2" fill="#6b7180">BRANCH</text>
  <text x="76" y="424" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24" fill="#22252f">Shivajinagar, Pune</text>

  <text x="540" y="392" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" letter-spacing="2.2" fill="#6b7180">OPENED</text>
  <text x="540" y="424" font-family="ui-monospace, Menlo, monospace" font-size="24" fill="#22252f">14 / 06 / 2018</text>

  <line x1="76" y1="470" x2="924" y2="470" stroke="#e3e3e8" stroke-width="2"/>
  <text x="76" y="508" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17" fill="#b4532b">SPECIMEN · SYNTHETIC · NOT A GOVERNMENT DOCUMENT</text>
  <text x="76" y="540" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#6b7180">No real bank, branch or account. Created for the Nivaaran prototype.</text>

  <g opacity="0.08" transform="rotate(-22 500 310)">
    <text x="500" y="330" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="6" fill="#22252f">SPECIMEN</text>
  </g>
</svg>
